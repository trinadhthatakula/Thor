# -----------------------------------------------------------------------------
# PERFORMANCE (THE BASICS)
# -----------------------------------------------------------------------------
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
# Bound concurrent tasks across variants; the CPU-count default can exhaust the
# shared Kotlin compiler heap. Override locally with --max-workers after measuring.
org.gradle.workers.max=2
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# -----------------------------------------------------------------------------
# MEMORY
# -----------------------------------------------------------------------------
# Gradle and the Kotlin daemon have separate heaps; worker processes add to these budgets.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g
# Kotlin has a separate heap; CI's combined release build exhausted 2 GB during
# Kotlin bytecode optimization. Keep the verified 4 GB budget in local and CI builds.
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC
# -----------------------------------------------------------------------------
# R8
# -----------------------------------------------------------------------------
android.r8.strictFullModeForKeepRules=true
# -----------------------------------------------------------------------------
# KOTLIN
# -----------------------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
# -----------------------------------------------------------------------------
# KSP (ROOM; KOIN USES ITS OWN COMPILER PLUGIN)
# -----------------------------------------------------------------------------
ksp.incremental=true
# -----------------------------------------------------------------------------
# ANDROID BUILD FEATURES
# -----------------------------------------------------------------------------
android.nonTransitiveRClass=true
# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
org.gradle.warning.mode=all
org.gradle.welcome=never
# -----------------------------------------------------------------------------
# APPLICATION VERSIONING (REPRODUCIBLE BUILD SETUP)
# -----------------------------------------------------------------------------
# Kept as fallback for clean builds
initialVersionCode=1921
# REQUIRED: The active source of truth for our release manager
# Logic: 1822 -> 1.82.2 (based on math: code/1000 . code%1000/10 . code%10)
# 1953 was consumed by the Play special-use foreground-service access submission.
versionCode=1970
# versionName intentionally omitted — auto-calculated from versionCode by the
# resolveVersionName()/calculateVersionName() helpers in app/build.gradle.kts
# (1908 -> 1.90.8). Per CLAUDE.md, never set versionName directly; bump versionCode only.
