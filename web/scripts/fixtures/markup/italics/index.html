<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thor</title>
  </head>
  <body>
    <main>
      <h1>Thor</h1>
      <!--
        What a single-asterisk run in MDX compiles to. The drafts carry 334 asterisk runs, so this
        is the likeliest content regression the site will ever have, and it is invisible in review
        because it renders as ordinary-looking prose.
      -->
      <p>The refusal <em>is</em> the argument.</p>
      <!-- The other spelling, usually arriving with a component copied in from elsewhere. -->
      <p>A frozen app is <i>not</i> uninstalled.</p>
    </main>
  </body>
</html>
