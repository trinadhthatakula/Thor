<!doctype html>
<!-- No lang on <html>, so a screen reader uses whatever voice it happens to have loaded. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Thor</title>
  </head>
  <body>
    <main>
      <h1>Thor</h1>
      <!--
        No alt at all, which is not the same as alt="": a screen reader falls back to reading the
        filename out loud.
      -->
      <img src="/screenshot.png" />
    </main>
  </body>
</html>
