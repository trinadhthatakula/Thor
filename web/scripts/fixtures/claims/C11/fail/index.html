<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Build an extension</title>
  </head>
  <body>
    <main>
      <h1>Build an extension</h1>
      <!--
        The worst shape a developer-facing page can carry: an instruction the app does not
        implement. The reader follows it, nothing happens, and they debug their own code.
        ExtensionManager reads one meta-data key and this is not it.
      -->
      <p>
        Declare the API level your extension was built against in a
        <code>thor.extension.api.version</code> meta-data entry, or Thor will refuse to load it.
      </p>
    </main>
  </body>
</html>
