    <title>Freezing</title>
  </head>
  <body>
    <main>
      <h1>Freezing</h1>
      <p>Thor freezes the preinstalled apps your phone will not let you uninstall.</p>
      <p>A frozen system app vanishes from the launcher and stops running until you thaw it.</p>
      <p>
        Its data is preserved either way: the disable path never touches the data directories, and
        the uninstall fallback carries -k.
      </p>
    </main>
  </body>
</html>
