  <body>
    <main>
      <h1>Cache</h1>
      <!--
        Reasonable-sounding, and it is the shape a developer assumes when they see a privileged
        operation: privileged calls fail loudly. This one has nowhere to fail to.
      -->
      <p>
        Without root, reading an app's cache size fails explicitly, so you always know whether the
        number in front of you is real.
      </p>
    </main>
