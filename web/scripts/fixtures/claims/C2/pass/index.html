  <body>
    <main>
      <h1>Cache</h1>
      <p>Without root, cache size reads zero.</p>
      <p>
        There is no failure channel to fail through: the gateway hands back 0L and the declared
        return type is a bare Long, so a zero and a refusal look identical from the outside.
      </p>
