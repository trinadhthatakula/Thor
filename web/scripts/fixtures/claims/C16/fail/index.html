      <h1>Freezing a system app</h1>
      <p>Root freezing removes the system app for your Android user whenever disabling is refused.</p>
      <p>Dhizuku freezing uninstalls the package for your user to complete the freeze.</p>
      <p>Freezing a system app always removes it when a vendor blocks disabling it.</p>
