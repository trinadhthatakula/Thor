  <body>
    <main>
      <h1>Uninstalling Thor</h1>
      <p>
        The frozen apps themselves survive a reinstall: the Import Disabled Apps prompt
        re-enumerates them from the platform.
      </p>
      <p>
        The freezer watchlist and your profiles are what actually go, because those live only in
        Thor's own database.
      </p>
    </main>
  </body>
