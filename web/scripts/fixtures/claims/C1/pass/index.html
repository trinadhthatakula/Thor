    <main>
      <h1>Freezing</h1>
      <p>Freezing a system app keeps its data.</p>
      <p>
        Thor asks the platform to disable the package first, and on the rare device that refuses,
        the fallback passes -k so the data directories and the runtime permission grants both
        survive the round trip.
      </p>
