<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Privacy</title>
  </head>
  <body>
    <main>
      <h1>Privacy</h1>
      <!--
        True of the app, false of this page, and false from the moment the site went live: Vercel
        sees the request IP, and Vercel was chosen deliberately.

        The typography here is deliberate. `don’t` carries a curly U+2019 apostrophe and the dash
        is an em dash — exactly what MDX's smartypants emits — so this fixture fails only if
        lib/text.mjs normalises before matching. Written with straight characters it would prove
        nothing, because the rule would still fire on text no page ever contains.
      -->
      <p>Nothing you do in Thor reaches a server of mine — I don’t run any servers.</p>
    </main>
  </body>
</html>
