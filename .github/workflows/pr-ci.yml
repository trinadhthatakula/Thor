name: PR CI

# This workflow has no `paths` / `paths-ignore` filter at any level, and must never
# gain one. `build-and-test` below is the required status context on both the dev and
# the master ruleset, `on.pull_request.paths` filters the WHOLE workflow, and GitHub
# reports a path-skipped required check as "Expected — Waiting for status" for as long
# as the PR is open. A site-only or docs-only PR would therefore become unmergeable
# with nothing in the UI explaining why.
#
# The cost is real and will keep inviting the change: a PR that only touches web/ still
# pays the ~7 minutes of Android build, unit tests and lint below. Seven minutes of CI
# is cheaper than a PR that cannot merge. The three release callers
# (1-dev-publish.yml, 2-master-promote.yml, 3-production-promote.yml) and web-ci.yml do
# filter — all four are safe to filter precisely because none of them is a required check.
#
# No `branches:` filter either, and for the same reason one level up: a filter here
# does not make a PR unchecked-and-obviously-so, it makes it unchecked-and-green.
# `pull_request.branches` matches the BASE, so while this read
# [ "master", "dev", "production" ] a stacked PR — one opened against a feature
# branch, which is how a dependent change is reviewed without waiting for its
# parent — ran none of the jobs below. What it showed instead was four green
# checks: the labeler, two Vercel no-ops, and a CodeRabbit reporting `pass` with
# "reviews are disabled for this base branch". Nothing distinguished that from a
# PR where everything ran and passed. Observed on #366.
#
# `edited` is in the types for the other half of the same problem. Changing a PR's
# base raises `pull_request` with action `edited`, and the default types are
# opened/synchronize/reopened — verified the hard way on #366, where a retarget
# from a feature branch to dev fired nothing and a close/reopen was needed. The
# stale result is not merely stale, it is wrong: the checkouts below pass no
# `ref:`, so actions/checkout uses its default of refs/pull/N/merge and every job
# here builds HEAD MERGED INTO THE BASE. Retarget the PR and the green on the page
# describes a merge into a branch that is no longer the target.
#
# The obvious economy — keep `edited` but add
# `if: github.event.action != 'edited' || github.event.changes.base` so a title or
# body edit does not pay for an Android build — is deliberately NOT taken. The
# concurrency group below is workflow-level with cancel-in-progress, and it is
# claimed before any job's `if` is evaluated: a body edit during a real run would
# cancel that run, then skip, and a skipped required check counts as a PASS to the
# ruleset. That is a false green, which is the exact defect this file is being
# edited to remove. Rerunning on a body edit only wastes minutes. Same trade as
# the paths note above — CI time is the cheap side.
#
# The cost is that a stack now pays for CI twice, parent and child, on shared
# files. That is the correct price: the alternative is the child never being built
# until it is already merged into the parent.
#
# Fork PRs need no extra thought here — see the `Assemble minified release` step
# below. This workflow exports no secret, and the release build type only assigns
# a signingConfig when credentials exist, so a fork PR and a branch PR produce the
# same unsigned APK. Widening the base does not widen what a PR can reach.
on:
  pull_request:
    # The three defaults, restated because naming any type replaces the default
    # set rather than extending it, plus `edited` for the base-change case above.
    types: [ opened, synchronize, reopened, edited ]

# Least-privilege token — this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs for the same PR.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false on every checkout in this file. The action
      # defaults it to TRUE, which leaves the job's token in the git config for
      # everything that runs afterwards — here, an Android build that executes
      # thousands of lines of third-party Gradle and R8 plugin code on a PR from
      # a branch anyone with write access can push. Nothing in this workflow
      # performs an authenticated git operation, so the credential is pure
      # exposure. It is read-only, which limits the blast radius; it does not
      # make leaving it lying around free.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # compileFossDebugAndroidTestKotlin is not decoration. Nothing else in this repo
      # compiles app/src/androidTest at all: assembleFossDebug builds main, the unit-test
      # task builds test/, lint analyses neither, and connectedAndroidTest — the task that
      # WOULD compile it — needs a device and never runs here. So instrumented tests could
      # be merged with a syntax error, a missing import or a reference to a symbol that was
      # renamed three PRs ago, and every check on the page would still be green. The gap
      # was found on #366, where a review claimed a missing import in AppActionRowTest; the
      # claim was false, but no check would have caught it if it had been true.
      #
      # Compile-only, deliberately. Running the tests needs an emulator, which is minutes
      # and a flake source; compiling them costs one extra Kotlin task against classes this
      # step has already built. It buys the guarantee that androidTest still refers to code
      # that exists, which is the failure mode that actually happens when a refactor sweeps
      # main/ and leaves androidTest/ behind.
      - name: Assemble + unit test + androidTest compile (foss debug)
        run: >
          ./gradlew assembleFossDebug testFossDebugUnitTest
          :app:compileFossDebugAndroidTestKotlin --stacktrace

      # Enforced, not advisory: :app is at 0 errors / 0 warnings and app/build.gradle.kts sets
      # warningsAsErrors, so lint debt can only be introduced deliberately now.
      #
      # Deliberately a step of build-and-test rather than a job of its own. "build-and-test" is
      # the only context the dev and master rulesets require; a separate lint job would show up
      # green-or-red on the PR but merge would not wait for it until someone also edited the
      # ruleset. Inside this job it is required the moment this file merges.
      #
      # storeRelease, not fossDebug: store is the variant Play receives, and the release build
      # type is where the strict detectors live. A debug-variant lint pass says very little
      # about what actually ships.
      - name: Android Lint (store release)
        id: lint
        run: ./gradlew lintStoreRelease --stacktrace

      # printTextReport puts the findings in the job log, but the HTML report carries the source
      # snippet and the explanation for each issue. Attach it so a red check is diagnosable from
      # the PR instead of requiring a local repro of a variant nobody builds by hand.
      - name: Upload lint report
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-results-storeRelease
          path: |
            app/build/reports/lint-results-storeRelease.html
            app/build/reports/lint-results-storeRelease.xml
            app/build/reports/lint-results-storeRelease.txt
          if-no-files-found: warn
          retention-days: 14

      # The only place R8 runs BEFORE a merge. It does run elsewhere — release-rung.yml
      # (invoked by all three release callers) and manual-build.yml both shell out to fastlane, which
      # assembles release — but every one of those triggers on a push to an already-merged
      # branch. On the PR itself nothing minified was ever built: assembleFossDebug above does
      # not minify (app/build.gradle.kts: `debug { isMinifyEnabled = false }`), lintStoreRelease
      # analyses unminified classes, and codeql.yml builds with `build-mode: none`. So the first
      # minified build of any change was the build that published it, and a shrinker break was
      # discovered by the release rather than by review. gradle.properties runs R8 in full mode
      # with android.r8.strictFullModeForKeepRules=true, which is exactly the configuration where
      # a keep that used to be implied quietly stops being one.
      #
      # Needs no secrets: the release build type assigns signingConfig only when jks.properties
      # or KEY_ALIAS exists (`hasSigningCredentials` in app/build.gradle.kts, added so a fresh
      # clone can still build), so this produces an unsigned release APK rather than dying in
      # validateSigningFossRelease. Nothing here exports the keystore env vars, so the result is
      # the same for a fork PR and for a branch PR.
      #
      # Both flavours, on every PR, deliberately. The two are not redundant: foss is the
      # reproducibility-critical one and the only consumer of proguard-rules-foss.pro, while
      # store is the only place the Play Billing dependency, its consumer keep rules and the
      # app/src/store sources are shrunk at all — a store-only R8 break is invisible to a foss
      # run. Gating store on `base_ref == 'master'` would defer exactly that check to the
      # release PR, which is the one place a red check is most expensive. The marginal cost is
      # small: lintStoreRelease above has already compiled the store release variant, so this
      # adds shrink/dex/package for store rather than a second full Kotlin compile.
      - name: Assemble minified release (R8)
        id: r8
        run: ./gradlew assembleFossRelease assembleStoreRelease --stacktrace

      # R8 writes missing_rules.txt into the mapping directory when it cannot resolve a class
      # something references, and the contents are the rules it wants. AGP fails the build in the
      # same breath today, so this is a second lock rather than the only one — but it is the lock
      # that survives the first being relaxed (a blanket -dontwarn added to quiet the symptom, or
      # a future AGP demoting missing classes to a warning), and it names the file in the log
      # instead of leaving it to be found inside an artifact.
      - name: Check R8 missing rules
        id: missing_rules
        # Runs even when the assemble failed, because if R8 is what failed then this is the step
        # that says so. Skipped along with the assemble if an earlier step went red.
        if: ${{ !cancelled() && steps.r8.outcome != 'skipped' }}
        run: |
          missing=0
          for rules in app/build/outputs/mapping/*/missing_rules.txt; do
            [ -f "$rules" ] || continue
            missing=1
            echo "::error::R8 could not resolve every class the code references. The fix is on the classpath, not in the keep rules: add the dependency that supplies the class, or correct its scope (a compileOnly that should be implementation). A -keep cannot help here — it preserves a class R8 can already see, it does not supply one it cannot. $rules holds the -dontwarn rules R8 suggests so the build can proceed regardless; those silence the diagnostic rather than fix it, so add them to app/proguard-rules.pro (or the flavour's own file) only once you have established the class is genuinely absent at runtime too. If that code path does run, -dontwarn buys a ClassNotFoundException instead of a build failure."
            cat "$rules"
          done
          exit "$missing"

      # configuration.txt is the fully merged rule set, every consumer rule from every dependency
      # included, and usage.txt is what R8 removed — between them a shrinker failure is readable
      # from the PR without rerunning the build locally on a variant nobody assembles by hand.
      # Failure-only, like the lint report above: on a green run the APK is unsigned and thrown
      # away, and its mapping.txt describes nothing that will ever ship.
      - name: Upload R8 outputs
        if: failure() && steps.r8.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          # One directory per variant inside, so the archive names the variant even when the
          # master-only store run above is part of it.
          name: r8-outputs
          path: app/build/outputs/mapping/
          if-no-files-found: warn
          retention-days: 14

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned by version AND checksum. `bash <(curl ...)`, which the upstream
      # README suggests, executes whatever the URL serves at that moment.
      #
      # Verify locally with THIS version, not with whatever Homebrew installed.
      # actionlint hands each `run:` block to shellcheck, and how it synthesises
      # the `env:` block into that script changed after 1.7.7: 1.7.12 declares
      # the env vars, 1.7.7 does not, so 1.7.7 alone raises SC2153 on a name
      # that merely resembles a local variable. A newer local actionlint is a
      # green run that proves nothing about this job.
      #
      #   curl -sSLo - https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_darwin_arm64.tar.gz \
      #     | tar -xz actionlint && ./actionlint
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location -o actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Lint workflows
        run: ./actionlint -color

      # Pinned, not the preinstalled one. ubuntu-latest ships 0.9.0, Homebrew
      # ships 0.11.0, and they disagree about which code a finding gets - 0.9
      # reports an uncalled function as SC2317, 0.10 renamed it SC2329. A
      # `disable=` directive naming one of them passes locally and fails here.
      # Worse, the runner image can bump under us with no commit to blame.
      #
      # 0.11.0 has a darwin.aarch64 build, so a contributor's `brew install
      # shellcheck` is the same binary this job runs.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl --fail --silent --show-error --location -o shellcheck.tar.gz "$url"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.gz" | sha256sum --check --strict
          tar -xzf shellcheck.tar.gz "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" ./shellcheck
          chmod +x shellcheck

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          ./shellcheck --version
          # -x follows `source`d files; -S style is the strictest useful level.
          find .github/scripts -name '*.sh' -print0 | xargs -0 ./shellcheck -x -S style

      - name: Run shell script tests
        run: .github/scripts/test/run-tests.sh

  # Runs on every PR rather than being path-filtered. on.pull_request.paths
  # filters the whole workflow, which would also gate build-and-test — the
  # required status check — leaving unrelated PRs pending forever.
  shizu-manifest:
    name: shizu-manifest
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the checker resolves origin/production, which a
      # shallow checkout does not create. Its `git fetch --depth=1 origin
      # production` fallback still works without the persisted credential —
      # Thor is a public repo, so that fetch is unauthenticated either way.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install check-jsonschema
        run: pipx install check-jsonschema

      # --warn-changelog-drift: warn on PRs, fail where it is actionable.
      # The checker derives its expected version from origin/production, so a
      # production promotion moves the target without any PR running. This job
      # is not path-filtered, so without the flag that promotion reddens every
      # open PR at once — for authors who did not cause the drift and cannot
      # fix it from their branch. Only that one condition is softened; a
      # malformed manifest, a missing file, an unresolvable ref or a schema
      # violation still fail this job. shizu-store-audit.yml runs the same
      # checker WITHOUT the flag, on master, where the fix is a commit away.
      - name: Check the Shizu store manifest
        run: |
          if [ ! -f shizu_store.json ]; then
            echo "No shizu_store.json on this branch — nothing to check."
            exit 0
          fi
          .github/scripts/check-shizu-manifest.sh --warn-changelog-drift
