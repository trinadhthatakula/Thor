name: CodeQL

on:
  push:
    branches: [ "master", "dev" ]
  # Unfiltered by base, and `edited` added — see the long note in pr-ci.yml, which
  # applies here unchanged. `push` stays scoped to the two long-lived branches
  # because that is what populates the security tab's baseline; the PR trigger is
  # what has to see every change, and a PR stacked on a feature branch was getting
  # no analysis at all. Naming any type replaces the default set, so the three
  # defaults are restated rather than extended.
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1' # weekly, Monday 03:27 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      # One language failing to build a database must not hide the other's findings.
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Kotlin extraction requires a compiler invocation after CodeQL initialization.
      - name: Compile Android sources for both flavors
        if: matrix.language == 'java-kotlin'
        run: >-
          ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process
          :app:compileFossDebugJavaWithJavac :app:compileStoreReleaseJavaWithJavac

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
