name: 2. Production Build & Distribute

on:
  push:
    branches: [ "production" ]
    # Same reasoning as dev-check.yml: a change that cannot reach the APK must not spend seven
    # minutes and a Play upload proving it. Safe to filter the whole workflow because this is
    # not a required status check — the production ruleset requires a review and a code owner,
    # no status contexts at all — so there is no check left pending by a skipped run.
    #
    # release-notes/** stays out of the list: a release push carries the gradle.properties bump
    # next to the notes, so it is never skipped by this filter.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      # Same reasoning as the entries around it: web/ is the landing page, adds no
      # Gradle module, and cannot reach the APK or the Play upload. It has its own
      # gate in web-ci.yml and its own deploy in Vercel. gradle.properties stays out
      # of this list, so a release push still builds.
      #
      # The three entries after 'web/**' are the site's plumbing, which that glob
      # does not cover — without them a push carrying only site plumbing would run
      # a full build and a Play upload to prove nothing.
      - 'web/**'
      - 'vercel.json'
      - '.github/workflows/web-*.yml'
      - '.github/labeler.yml'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/scripts/**'
      - '.github/assets/**'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

# Don't let overlapping release runs race on the same version tag / Play upload.
concurrency:
  group: prod-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so the release-notes changelog fallback works

      # Catches the cheap half of "Version code NNNN has already been used": pushing to production
      # without a chore(release) bump. Play only says so after the ~7 minute build and the upload
      # attempt; git can answer that particular case here in seconds.
      #
      # It does NOT catch the other half. dev-check.yml still publishes from master when the code
      # moves, and the same chore(release) commit reaches both branches, so master can take a code
      # on `alpha` before production asks for it on `beta` — Play's uniqueness is per app, not
      # per track. That collision is real, pre-existing, and out of scope here; it is tracked in
      # docs/follow-ups/two-branches-one-play-version-code.md. Do not "fix" it by widening this
      # check, which cannot see what master did.
      #
      # Fails open on any git edge case (branch creation, unreachable parent) — a release must
      # not be blocked by this check failing to make up its mind. workflow_dispatch skips it
      # outright, which is also the escape hatch for re-publishing a code Play never accepted.
      - name: Verify the version code moved
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version_code_at() {
            git show "$1:gradle.properties" 2>/dev/null \
              | sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*//p' | tail -n 1
          }

          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No resolvable previous commit for this push — skipping the version code check."
            exit 0
          fi

          # `|| true` so a git failure inside the substitution cannot trip `set -e` and turn a
          # legitimate release red — an empty OLD/NEW is handled below as "cannot tell", not as
          # an error.
          OLD=$(version_code_at "$BEFORE") || true
          NEW=$(version_code_at HEAD) || true

          if [ -z "$NEW" ]; then
            echo "::error::versionCode is missing from gradle.properties."
            exit 1
          fi

          if [ "$OLD" = "$NEW" ]; then
            echo "::error::versionCode is still $NEW, which Google Play has already taken — the upload would fail after the full build. Land a chore(release) bump before pushing to production, or re-run this workflow via workflow_dispatch if you know Play never accepted $NEW."
            exit 1
          fi

          echo "versionCode ${OLD:-<none>} -> $NEW"

      - name: Setup JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # --- SECRET DECODING ---
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Decode Google Play Service Account
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: echo "$PLAY_STORE_JSON_KEY" > app/google-play-api.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- FASTLANE (OPEN TESTING) ---
      # One of the repo's two Play uploads — this one to `beta`, dev-check.yml's to `alpha`.
      # Play rejects the second upload of a version code regardless of track, so when the same
      # chore(release) commit reaches master and production, exactly one of the two runs can
      # succeed. Which one wins is currently a race, and that is the open problem in
      # docs/follow-ups/two-branches-one-play-version-code.md — not something this file decides.
      - name: Run Fastlane (Distribute Prod)
        env:
          JSON_KEY_FILE: ${{ github.workspace }}/app/google-play-api.json
          SUPPLY_JSON_KEY: ${{ github.workspace }}/app/google-play-api.json
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/app/release.jks
        # The production lane: open testing (`beta`). Promotion to production is manual, in the Console.
        run: bundle exec fastlane android distribute_production

      # --- PREPARE RELEASE NOTES ---
      - name: Prepare Release Notes
        id: prep_notes
        run: |
          if [ ! -s version_name.txt ]; then
            echo "Error: version_name.txt is missing or empty!" >&2
            exit 1
          fi
          VERSION_NAME=$(cat version_name.txt)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          
          # Resolve GitHub notes
          GITHUB_NOTES_FILE="release-notes/v${VERSION_NAME}/github.md"
          if [ ! -f "$GITHUB_NOTES_FILE" ]; then
            GITHUB_NOTES_FILE="release-notes/${VERSION_NAME}/github.md"
          fi
          
          if [ -f "$GITHUB_NOTES_FILE" ]; then
            echo "github_notes_path=$GITHUB_NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            # Fallback to generating commit log since the last tag
            FALLBACK_FILE="github_release_notes_fallback.md"
            echo "### Changelog" > "$FALLBACK_FILE"
            echo "" >> "$FALLBACK_FILE"
            
            # Find last tag and get commits
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              echo "Commits since $LAST_TAG:" >> "$FALLBACK_FILE"
              git log "$LAST_TAG..HEAD" --oneline >> "$FALLBACK_FILE"
            else
              echo "Recent commits:" >> "$FALLBACK_FILE"
              git log --oneline -n 20 >> "$FALLBACK_FILE"
            fi
            echo "github_notes_path=$FALLBACK_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.prep_notes.outputs.version_name }}
          name: Release v${{ steps.prep_notes.outputs.version_name }}
          body_path: ${{ steps.prep_notes.outputs.github_notes_path }}
          files: |
            app/build/distribution/foss/foss-release.apk
            app/build/distribution/store/store-release.apk
            app/build/outputs/bundle/storeRelease/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- SECURITY CLEANUP ---
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f app/release.jks
          rm -f app/google-play-api.json