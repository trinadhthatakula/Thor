name: Telegram Release

# Manual re-broadcast, NOT a rung. It builds APKs and posts them to the release
# channel; it uploads nothing to Play (build_release_candidates passes
# upload_to_store: false), so it cannot violate the ladder's one-uploader rule.
#
# It exists for the failure the ladder cannot retry: release-rung.yml's Telegram
# step is guarded by !cancelled() so a rejected broadcast never vetoes a release,
# which means a version can be live on Play and tagged on GitHub with nobody
# told. Re-running the rung is not an option by then - the Play upload already
# happened. This is how you send the announcement after the fact.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code to build (leave empty to use gradle.properties' versionCode)"
        required: false
        type: string

jobs:
  build-and-announce:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check for releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # --- SECRET DECODING ---
      # Validated, not just written. An unset secret expands to the empty string
      # and `echo` still writes a newline, so the file exists and `[ -s ]` is
      # true - the build would run on to a signing failure several minutes later
      # with nothing naming the cause.
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.jks
          if [ ! -s app/release.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to nothing - is the secret set on this repo?" >&2
            exit 1
          fi

      - name: Decode Google Play Service Account
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAY_STORE_JSON_KEY" > app/google-play-api.json
          # A size test cannot catch this one, hence jq: the file is valid JSON
          # or it is not a service account, and client_email is the field every
          # supply call needs.
          if ! jq -e 'has("client_email")' app/google-play-api.json > /dev/null 2>&1; then
            echo "::error::PLAY_STORE_JSON_KEY is not a service-account JSON key - is the secret set on this repo?" >&2
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- BUILD ARTIFACTS ---
      - name: Run Fastlane (Build Candidates)
        env:
          JSON_KEY_FILE: ${{ github.workspace }}/app/google-play-api.json
          SUPPLY_JSON_KEY: ${{ github.workspace }}/app/google-play-api.json
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/app/release.jks
          # Map inputs to Env Vars (cleaner than passing directly in run command string)
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          # Omit the argument entirely when the input is blank. Passing
          # version_code:"" hands the lane an empty string, and "" is truthy in
          # Ruby - that is how a blank input used to build v0.0.0. The Fastfile
          # rejects a blank override now too; this keeps the two independent.
          if [ -n "${INPUT_VERSION_CODE// /}" ]; then
            bundle exec fastlane android build_release_candidates version_code:"$INPUT_VERSION_CODE"
          else
            bundle exec fastlane android build_release_candidates
          fi

      # --- PREPARE ANNOUNCEMENT ---
      - name: Read Version Info
        id: version_info
        run: |
          set -euo pipefail
          VERSION_NAME=$(cat version_name.txt)
          VERSION_CODE=$(cat version_code.txt)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          
          # Resolve Telegram notes
          TELEGRAM_NOTES_FILE="release-notes/v${VERSION_NAME}/telegram.md"
          if [ ! -f "$TELEGRAM_NOTES_FILE" ]; then
            TELEGRAM_NOTES_FILE="release-notes/${VERSION_NAME}/telegram.md"
          fi
          
          if [ -f "$TELEGRAM_NOTES_FILE" ]; then
            echo "telegram_notes_path=$TELEGRAM_NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "has_telegram_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_telegram_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for GitHub Release
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.VERSION_NAME }}"
          echo "Checking for release tag: $TAG"

          # Check if release exists using GitHub CLI
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release found!"
            echo "release_url=https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release found for $TAG"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Telegram Channel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}
          RELEASE_URL: ${{ steps.check_release.outputs.release_url }}
          HAS_RELEASE: ${{ steps.check_release.outputs.has_release }}
          HAS_TELEGRAM_NOTES: ${{ steps.version_info.outputs.has_telegram_notes }}
          TELEGRAM_NOTES_PATH: ${{ steps.version_info.outputs.telegram_notes_path }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STORE_APK="app/build/distribution/store/store-release.apk"
          FOSS_APK="app/build/distribution/foss/foss-release.apk"

          for apk in "$STORE_APK" "$FOSS_APK"; do
            if [ ! -f "$apk" ]; then
              echo "::error::$apk is missing — the build did not produce it." >&2
              exit 1
            fi
          done

          # 1. Construct the Caption
          CAPTION=$(printf "⚡️ *Thor v%s Released!*\n\nBuild: %s\nBranch: %s" "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_REF_NAME")

          if [ "$HAS_TELEGRAM_NOTES" = "true" ] && [ -f "$TELEGRAM_NOTES_PATH" ]; then
            CAPTION=$(printf "%s\n\n%s" "$CAPTION" "$(cat "$TELEGRAM_NOTES_PATH")")
          else
            CAPTION=$(printf "%s\n\n• Bug fixes and performance improvements" "$CAPTION")
          fi
          
          if [ "$HAS_RELEASE" = "true" ]; then
            CAPTION=$(printf "%s\n\n🔗 [View on GitHub](%s)" "$CAPTION" "$RELEASE_URL")
          fi
          
          # A caption over 1024 UTF-16 units is REJECTED, not truncated. These
          # two sends used to be bare `curl -s ... > /dev/null`, which discards
          # both the status and Telegram's own explanation — the step went green
          # having broadcast nothing, and that is the exact failure this workflow
          # exists to recover from. --fail-with-body writes the error body to
          # stdout (its only difference from --fail, which is why redirecting it
          # away undoes the flag), so the "caption is too long" line reaches the
          # log. --max-time turns a hung upload into a failure rather than a job
          # that sits until its own timeout.
          send() {
            local apk="$1" caption="$2" label="$3" body
            echo "Sending $label..."
            if ! body=$(curl -s --fail-with-body --connect-timeout 15 --max-time 300 \
                             -F "chat_id=$TELEGRAM_CHAT_ID" \
                             -F "document=@$apk" \
                             -F "caption=$caption" \
                             -F "parse_mode=Markdown" \
                             "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"); then
              # Telegram's response body, not the request — no token or chat id
              # can appear here.
              echo "::error::Telegram rejected the $label broadcast: ${body}" >&2
              return 1
            fi
          }

          # 2. Send Store APK
          send "$STORE_APK" "$CAPTION" "Store APK"

          # 3. Send FOSS APK as a second message
          send "$FOSS_APK" "🔓 *FOSS Version (No Google Services)*" "FOSS APK"

      # --- SECURITY CLEANUP ---
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f app/release.jks
          rm -f app/google-play-api.json