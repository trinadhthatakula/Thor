name: Dev Build & Test

on:
  push:
    branches: [ "master" ]
    # A change that cannot reach the APK should not spend seven minutes proving it — run
    # 30286348722 built for 339s off a one-file change to .github/scripts/. Filtering the whole
    # workflow is only safe because this one is not a required status check: the rulesets on dev
    # and master require "build-and-test" from pr-ci.yml and nothing else, and GitHub reports a
    # path-skipped required check as pending forever. That is why pr-ci.yml has no path filters
    # and this one does.
    #
    # release-notes/** is deliberately absent: the notes are read by the run that publishes them,
    # and that run always carries the gradle.properties bump alongside, so it is never skipped.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/scripts/**'
      - '.github/assets/**'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

# Don't let overlapping runs race on the same version tag.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so the release-notes changelog fallback works

      - name: Setup JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      # Added Ruby for Fastlane in Dev
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # --- 1. SECRETS INJECTION ---
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.jks

      # Left in place although this job no longer uploads to Play: fastlane's Appfile resolves
      # json_key_file at boot from JSON_KEY_FILE, and the cleanup step below shreds it either
      # way. Dropping it is a separate, deliberate change to secret handling, not a side effect
      # of moving the Play upload to the production branch.
      - name: Decode Google Play Service Account
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: echo "$PLAY_STORE_JSON_KEY" > app/google-play-api.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- 2. IS THIS PUSH A RELEASE? ---
      # Every push to master used to publish, and master is a trunk, not a release trigger. That
      # collides head-on with this repo's own rule that versionCode moves *only* in a dedicated
      # chore(release) commit: under that rule most master pushes deliberately carry an unchanged
      # code, so `fix(shizu): …` merges kept dying on "Version code NNNN has already been used".
      # The check was firing on the convention being followed correctly, which is why master has
      # been red continuously rather than red once.
      #
      # Play's duplicate-code rejection is NOT suppressed anywhere here, and must not be — it is
      # the real versioning gate and it is server-side. This step only decides whether a push was
      # *meant* to publish at all, so the rejection is left to fire on an actual mistake: a
      # chore(release) that reuses a code still fails exactly as it does today.
      #
      # Compares the parsed value, not `git diff --quiet -- gradle.properties`: that file also
      # carries Gradle daemon flags and memory settings, and a JVM tweak is not a release.
      # HEAD^ on a PR merge commit is the previous master tip (first parent), which is the
      # comparison we want. Fails OPEN — if the old value cannot be read we attempt the publish
      # and let Play adjudicate, rather than silently skipping a real release.
      - name: Detect release (did versionCode change?)
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — an explicit request to publish."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read_code() { grep -E '^[[:space:]]*versionCode[[:space:]]*=' | head -n1 | cut -d= -f2 | tr -d '[:space:]'; }
          NEW=$(read_code < gradle.properties)
          OLD=$(git show 'HEAD^:gradle.properties' 2>/dev/null | read_code || echo "")
          if [ -z "$NEW" ]; then
            echo "::error::versionCode not found in gradle.properties"
            exit 1
          fi
          if [ -n "$OLD" ] && [ "$OLD" = "$NEW" ]; then
            echo "::notice::versionCode unchanged at $NEW — building for verification only, not publishing."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::versionCode ${OLD:-<unreadable>} -> $NEW — publishing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # --- 3. BUILD (FASTLANE) ---
      # One step, two lanes, so the env block is not duplicated. distribute_dev builds and uploads
      # to the `alpha` (closed testing) track; build_release_candidates runs the same copyStoreReleaseApk /
      # copyFossReleaseApk tasks and writes the same version_name.txt / version_code.txt, but skips
      # upload_to_play_store and bundleStoreRelease. A non-release push therefore still proves
      # master compiles and signs — it just publishes nothing.
      - name: Run Fastlane
        env:
          JSON_KEY_FILE: ${{ github.workspace }}/app/google-play-api.json
          SUPPLY_JSON_KEY: ${{ github.workspace }}/app/google-play-api.json
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/app/release.jks
        run: bundle exec fastlane android ${{ steps.ver.outputs.release == 'true' && 'distribute_dev' || 'build_release_candidates' }}

      # --- 4. PREPARE RELEASE NOTES ---
      # From here down everything is publication, so it all rides on the same condition. A
      # verification build stops after the Fastlane step.
      - name: Prepare Release Notes
        id: prep_notes
        if: steps.ver.outputs.release == 'true'
        run: |
          if [ ! -f version_name.txt ] || [ ! -f version_code.txt ]; then
            echo "Error: version_name.txt or version_code.txt is missing!" >&2
            exit 1
          fi
          VERSION_NAME=$(cat version_name.txt)
          VERSION_CODE=$(cat version_code.txt)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          
          # Resolve GitHub notes
          GITHUB_NOTES_FILE="release-notes/v${VERSION_NAME}/github.md"
          if [ ! -f "$GITHUB_NOTES_FILE" ]; then
            GITHUB_NOTES_FILE="release-notes/${VERSION_NAME}/github.md"
          fi
          
          if [ -f "$GITHUB_NOTES_FILE" ]; then
            echo "github_notes_path=$GITHUB_NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            # Fallback to generating commit log since the last tag
            FALLBACK_FILE="github_release_notes_fallback.md"
            echo "### Changelog (Dev Build)" > "$FALLBACK_FILE"
            echo "" >> "$FALLBACK_FILE"
            
            # Find last tag and get commits
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              echo "Commits since $LAST_TAG:" >> "$FALLBACK_FILE"
              git log "$LAST_TAG..HEAD" --oneline >> "$FALLBACK_FILE"
            else
              echo "Recent commits:" >> "$FALLBACK_FILE"
              git log --oneline -n 20 >> "$FALLBACK_FILE"
            fi
            echo "github_notes_path=$FALLBACK_FILE" >> "$GITHUB_OUTPUT"
          fi

          # Resolve Telegram notes
          TELEGRAM_NOTES_FILE="release-notes/v${VERSION_NAME}/telegram.md"
          if [ ! -f "$TELEGRAM_NOTES_FILE" ]; then
            TELEGRAM_NOTES_FILE="release-notes/${VERSION_NAME}/telegram.md"
          fi
          
          if [ -f "$TELEGRAM_NOTES_FILE" ]; then
            echo "telegram_notes_path=$TELEGRAM_NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "has_telegram_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_telegram_notes=false" >> "$GITHUB_OUTPUT"
          fi

      # --- 5. TELEGRAM ---
      - name: Send APK to Telegram
        if: success() && steps.ver.outputs.release == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HAS_TELEGRAM_NOTES: ${{ steps.prep_notes.outputs.has_telegram_notes }}
          TELEGRAM_NOTES_PATH: ${{ steps.prep_notes.outputs.telegram_notes_path }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Fastlane 'copyStoreReleaseApk' task puts it here
          APK_PATH=$(find app/build/distribution/store -name "*.apk" | head -n 1)
          
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found in app/build/distribution/store/"
            exit 1
          fi

          echo "Sending $APK_PATH to Telegram..."

          # Read the track fastlane actually uploaded to rather than restating it. This line used to
          # be the literal "Internal Testing" and stayed that way after the lane moved, which nothing
          # in the repo could catch — there is no actionlint or shellcheck over .github/workflows.
          # The default arm prints whatever key it got instead of inventing a friendly name for it.
          TRACK=$(cat track.txt 2>/dev/null || echo "")
          case "$TRACK" in
            internal)   TRACK_LABEL="Internal Testing" ;;
            alpha)      TRACK_LABEL="Closed Testing" ;;
            beta)       TRACK_LABEL="Open Testing" ;;
            production) TRACK_LABEL="Production" ;;
            "")         TRACK_LABEL="unknown" ;;
            *)          TRACK_LABEL="$TRACK" ;;
          esac

          CAPTION=$(printf "🚀 *Thor (Valhalla) Dev Build*\n\nBranch: %s\nAuthor: %s\nTrack: %s\nStatus: Uploaded to Play Store & GitHub" "$GITHUB_REF_NAME" "$GITHUB_ACTOR" "$TRACK_LABEL")

          if [ "$HAS_TELEGRAM_NOTES" = "true" ] && [ -r "$TELEGRAM_NOTES_PATH" ]; then
            CAPTION=$(printf "%s\n\n%s" "$CAPTION" "$(cat "$TELEGRAM_NOTES_PATH")")
          else
            CAPTION=$(printf "%s\n\n• Bug fixes and performance improvements" "$CAPTION")
          fi

          curl -s -F "chat_id=$TELEGRAM_CHAT_ID" \
               -F "document=@$APK_PATH" \
               -F "caption=$CAPTION" \
               -F "parse_mode=Markdown" \
               "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" > /dev/null

      # --- 6. GITHUB RELEASE (PRE-RELEASE) ---
      - name: Create GitHub Pre-Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Unique tag for dev builds: v1.0.0-dev-45
          tag_name: v${{ steps.prep_notes.outputs.version_name }}-dev-${{ github.run_number }}
          name: Dev Build v${{ steps.prep_notes.outputs.version_name }} (${{ github.run_number }})
          body_path: ${{ steps.prep_notes.outputs.github_notes_path }}
          files: |
            app/build/distribution/foss/foss-release.apk
            app/build/distribution/store/store-release.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 7. CLEANUP ---
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f app/release.jks
          rm -f app/google-play-api.json