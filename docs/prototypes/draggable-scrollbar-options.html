<script>
(() => {
  const root = document.getElementById('thor-draggable-scrollbar-options-20260923');
  if (!root) return;
  root.querySelectorAll('button, label, .thor-rail-input, .thor-thumb-hit').forEach((element) => element.classList.add('cursor-interaction'));

  const apps = [
    ['Aegis', 'com.beemdevelopment.aegis'], ['AntennaPod', 'de.danoeh.antennapod'],
    ['Aurora Store', 'com.aurora.store'], ['Bitwarden', 'com.x8bit.bitwarden'],
    ['Brave', 'com.brave.browser'], ['Calculator', 'com.google.android.calculator'],
    ['Calendar', 'com.google.android.calendar'], ['Camera', 'com.android.camera2'],
    ['Chrome', 'com.android.chrome'], ['Clock', 'com.google.android.deskclock'],
    ['Contacts', 'com.google.android.contacts'], ['Discord', 'com.discord'],
    ['Drive', 'com.google.android.apps.docs'], ['F-Droid', 'org.fdroid.fdroid'],
    ['Files', 'com.google.android.apps.nbu.files'], ['Firefox', 'org.mozilla.firefox'],
    ['Gallery', 'org.fossify.gallery'], ['Gmail', 'com.google.android.gm'],
    ['Google Maps', 'com.google.android.apps.maps'], ['Instagram', 'com.instagram.android'],
    ['K-9 Mail', 'com.fsck.k9'], ['Keep Notes', 'com.google.android.keep'],
    ['Kindle', 'com.amazon.kindle'], ['Lightroom', 'com.adobe.lrmobile'],
    ['Messages', 'com.google.android.apps.messaging'], ['Music', 'org.fossify.musicplayer'],
    ['Netflix', 'com.netflix.mediaclient'], ['NewPipe', 'org.schabi.newpipe'],
    ['Notes', 'org.fossify.notes'], ['OneDrive', 'com.microsoft.skydrive'],
    ['Open Camera', 'net.sourceforge.opencamera'], ['OsmAnd', 'net.osmand'],
    ['Phone', 'com.google.android.dialer'], ['Photos', 'com.google.android.apps.photos'],
    ['Proton Mail', 'ch.protonmail.android'], ['Reddit', 'com.reddit.frontpage'],
    ['Settings', 'com.android.settings'], ['Signal', 'org.thoughtcrime.securesms'],
    ['Spotify', 'com.spotify.music'], ['Telegram', 'org.telegram.messenger'],
    ['Thor', 'com.valhalla.thor'], ['VLC', 'org.videolan.vlc'],
    ['WhatsApp', 'com.whatsapp'], ['YouTube', 'com.google.android.youtube'],
    ['YT Music', 'com.google.android.apps.youtube.music'], ['Zoom', 'us.zoom.videomeetings']
  ];
  const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
  const panels = [...root.querySelectorAll('[data-option]')];
  const saved = window.openai && window.openai.widgetState && window.openai.widgetState.privateContent;
  let view = saved && saved.view === 'grid' ? 'grid' : 'list';
  let rtl = !!(saved && saved.rtl);

  function makeItems(scroller) {
    const fragment = document.createDocumentFragment();
    apps.forEach(([name, packageName], index) => {
      const row = document.createElement('div');
      row.className = 'thor-app-item';
      row.setAttribute('role', 'listitem');
      const icon = document.createElement('span');
      icon.className = `thor-app-icon thor-icon-${index % 5}`;
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = name.charAt(0);
      const copy = document.createElement('span');
      copy.className = 'thor-app-copy';
      const title = document.createElement('span');
      title.className = 'thor-app-name';
      title.textContent = name;
      const detail = document.createElement('span');
      detail.className = 'thor-app-package';
      detail.textContent = packageName;
      copy.append(title, detail);
      row.append(icon, copy);
      fragment.append(row);
    });
    scroller.append(fragment);
  }

  function visibleRange(scroller) {
    const viewport = scroller.getBoundingClientRect();
    let first = -1;
    let last = -1;
    [...scroller.children].forEach((row, index) => {
      const bounds = row.getBoundingClientRect();
      if (bounds.bottom > viewport.top && bounds.top < viewport.bottom) {
        if (first < 0) first = index;
        last = index;
      }
    });
    return [Math.max(0, first) + 1, Math.max(0, last) + 1];
  }

  function update(panel) {
    const scroller = panel.querySelector('.thor-app-scroller');
    const rail = panel.querySelector('[data-rail]');
    const thumb = panel.querySelector('[data-thumb]');
    const hit = panel.querySelector('[data-thumb-hit]');
    const bubble = panel.querySelector('[data-bubble]');
    const range = panel.querySelector('[data-range]');
    const maxScroll = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
    rail.hidden = maxScroll < 1;
    range.disabled = rail.hidden;
    if (rail.hidden) return;
    const trackHeight = rail.clientHeight;
    const minLength = panel.thorSpec.minLength;
    const length = Math.min(trackHeight, Math.max(minLength, trackHeight * scroller.clientHeight / scroller.scrollHeight));
    const travel = Math.max(0, trackHeight - length);
    const ratio = maxScroll ? clamp(scroller.scrollTop / maxScroll, 0, 1) : 0;
    const top = ratio * travel;
    thumb.style.height = `${length}px`;
    thumb.style.top = `${top}px`;
    const isExpressive = rail.classList.contains('is-active') || rail.classList.contains('is-keyboard');
    const width = isExpressive ? panel.thorSpec.activeWidth : panel.thorSpec.idleWidth;
    thumb.style.width = `${width}px`;
    thumb.style.insetInlineEnd = `${panel.thorSpec.center - width / 2}px`;
    hit.style.height = `${Math.max(48, length)}px`;
    hit.style.top = `${clamp(top + length / 2 - Math.max(48, length) / 2, 0, trackHeight - Math.max(48, length))}px`;
    bubble.style.top = `${clamp(top + length / 2, 18, trackHeight - 18)}px`;
    const [first, last] = visibleRange(scroller);
    bubble.textContent = `${first}–${last} of ${apps.length}`;
    range.setAttribute('aria-valuetext', `Apps ${first} to ${last} of ${apps.length}`);
    range.value = String(Math.round(ratio * 100));
    panel.thorMetrics = { length, travel, maxScroll };
  }

  function scrollFromPointer(panel, clientY, gripOffset) {
    const scroller = panel.querySelector('.thor-app-scroller');
    const rail = panel.querySelector('[data-rail]');
    const metrics = panel.thorMetrics;
    if (!metrics || metrics.maxScroll <= 0) return;
    const desiredTop = clamp(clientY - rail.getBoundingClientRect().top - gripOffset, 0, metrics.travel);
    const ratio = metrics.travel ? desiredTop / metrics.travel : 0;
    scroller.scrollTop = ratio * metrics.maxScroll;
    update(panel);
  }

  panels.forEach((panel) => {
    const scroller = panel.querySelector('.thor-app-scroller');
    const range = panel.querySelector('[data-range]');
    const thumb = panel.querySelector('[data-thumb]');
    const hit = panel.querySelector('[data-thumb-hit]');
    const rail = panel.querySelector('[data-rail]');
    panel.thorSpec = { idleWidth: 6, activeWidth: 17, minLength: 58, center: 19 };
    makeItems(scroller);
    scroller.addEventListener('scroll', () => update(panel), { passive: true });
    let drag = null;
    const beginDrag = (event) => {
      if (event.button !== 0 && event.pointerType === 'mouse') return;
      event.preventDefault();
      range.blur();
      rail.classList.remove('is-keyboard');
      rail.classList.add('is-active');
      update(panel);
      const railTop = rail.getBoundingClientRect().top;
      const thumbTop = parseFloat(thumb.style.top) || 0;
      const gripOffset = clamp(event.clientY - railTop - thumbTop, 0, panel.thorMetrics.length);
      drag = { pointerId: event.pointerId, gripOffset };
      hit.setPointerCapture(event.pointerId);
      scrollFromPointer(panel, event.clientY, gripOffset);
    };
    const moveDrag = (event) => {
      if (!drag || event.pointerId !== drag.pointerId) return;
      event.preventDefault();
      scrollFromPointer(panel, event.clientY, drag.gripOffset);
    };
    const endDrag = (event) => {
      if (!drag || event.pointerId !== drag.pointerId) return;
      drag = null;
      rail.classList.remove('is-active');
      update(panel);
    };
    hit.addEventListener('pointerdown', beginDrag);
    hit.addEventListener('pointermove', moveDrag);
    hit.addEventListener('pointerup', endDrag);
    hit.addEventListener('pointercancel', endDrag);
    hit.addEventListener('lostpointercapture', endDrag);
    range.addEventListener('focus', () => {
      rail.classList.add('is-keyboard');
      update(panel);
    });
    range.addEventListener('blur', () => {
      rail.classList.remove('is-keyboard');
      update(panel);
    });
    range.addEventListener('input', () => {
      if (drag) return;
      const ratio = Number(range.value) / 100;
      scroller.scrollTop = ratio * Math.max(0, scroller.scrollHeight - scroller.clientHeight);
      update(panel);
    });
    range.addEventListener('keydown', (event) => {
      const steps = {
        ArrowUp: -64,
        ArrowDown: 64,
        PageUp: -scroller.clientHeight,
        PageDown: scroller.clientHeight,
        Home: -Infinity,
        End: Infinity
      };
      if (!(event.key in steps)) return;
      event.preventDefault();
      const amount = steps[event.key];
      scroller.scrollTop = Number.isFinite(amount) ? scroller.scrollTop + amount : amount < 0 ? 0 : scroller.scrollHeight;
      update(panel);
    });
    const observer = new ResizeObserver(() => update(panel));
    observer.observe(scroller);
    observer.observe(rail);
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: panel.querySelector('.thor-phone'), onChange: () => update(panel) });
      tweak.addSlider(panel.thorSpec, 'idleWidth', { label: 'Quiet thumb width', min: 4, max: 10, unit: 'px' });
      tweak.addSlider(panel.thorSpec, 'activeWidth', { label: 'Drag capsule width', min: 12, max: 28, unit: 'px' });
      tweak.addSlider(panel.thorSpec, 'minLength', { label: 'Minimum thumb height', min: 40, max: 100, unit: 'px' });
    }
  });

  function applyPreview() {
    root.dir = rtl ? 'rtl' : 'ltr';
    root.querySelector('[data-rtl]').checked = rtl;
    root.querySelectorAll('[data-view]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
    panels.forEach((panel) => {
      const scroller = panel.querySelector('.thor-app-scroller');
      scroller.classList.toggle('is-grid', view === 'grid');
      scroller.scrollTop = 0;
      update(panel);
    });
    root.querySelector('[data-live]').textContent = `${view === 'grid' ? 'Grid' : 'List'} preview, ${rtl ? 'right-to-left' : 'left-to-right'}`;
  }
  function savePreview() {
    if (window.openai && typeof window.openai.setWidgetState === 'function') {
      window.openai.setWidgetState({ modelContent: { layout: view, direction: rtl ? 'RTL' : 'LTR' }, privateContent: { view, rtl } }).catch(() => {});
    }
  }
  root.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => {
    view = button.dataset.view;
    applyPreview();
    savePreview();
  }));
  root.querySelector('[data-rtl]').addEventListener('change', (event) => {
    rtl = event.target.checked;
    applyPreview();
    savePreview();
  });
  window.addEventListener('openai:set_globals', (event) => {
    const state = event.detail && event.detail.globals && event.detail.globals.widgetState && event.detail.globals.widgetState.privateContent;
    if (!state) return;
    view = state.view === 'grid' ? 'grid' : 'list';
    rtl = !!state.rtl;
    applyPreview();
  });
  applyPreview();
})();
</script>
